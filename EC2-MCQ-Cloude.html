<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS EC2 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --card: #111827;
    --border: #1e2d40;
    --accent: #ff9f43;
    --accent2: #ee5a24;
    --correct: #00e5a0;
    --wrong: #ff4d6d;
    --text: #e2e8f0;
    --muted: #64748b;
    --highlight: rgba(255,159,67,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px;
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(255,159,67,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(238,90,36,0.06) 0%, transparent 50%);
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .badge {
    display: inline-block;
    background: rgba(255,159,67,0.1);
    border: 1px solid rgba(255,159,67,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 6px 16px;
    border-radius: 2px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    margin-top: 8px;
    font-size: 14px;
    font-family: 'Space Mono', monospace;
  }

  .quiz-container {
    width: 100%;
    max-width: 780px;
  }

  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 40px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.35s ease;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .question {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.2s ease;
    font-size: 15px;
    line-height: 1.5;
    position: relative;
  }

  .option:hover:not(.locked) {
    border-color: rgba(255,159,67,0.4);
    background: var(--highlight);
    transform: translateX(4px);
  }

  .option-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s ease;
  }

  .option.selected .option-dot {
    border-color: var(--accent);
    background: var(--accent);
  }

  .option.correct {
    border-color: var(--correct);
    background: rgba(0,229,160,0.06);
  }

  .option.correct .option-dot {
    border-color: var(--correct);
    background: var(--correct);
  }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(255,77,109,0.06);
  }

  .option.wrong .option-dot {
    border-color: var(--wrong);
    background: var(--wrong);
  }

  .option-label { flex: 1; }

  .option-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    margin-left: auto;
    flex-shrink: 0;
    align-self: center;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .tag-correct { background: rgba(0,229,160,0.15); color: var(--correct); }
  .tag-wrong   { background: rgba(255,77,109,0.15); color: var(--wrong); }

  .explanation-box {
    margin-top: 20px;
    padding: 16px 20px;
    background: rgba(255,159,67,0.04);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .explanation-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .explanation-text {
    font-size: 14px;
    color: #94a3b8;
    line-height: 1.6;
  }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    padding: 12px 28px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-back {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .btn-back:hover { border-color: rgba(255,159,67,0.4); color: var(--text); }
  .btn-back:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-next {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    box-shadow: 0 4px 20px rgba(255,159,67,0.2);
  }

  .btn-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(255,159,67,0.35);
  }

  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-reset {
    background: rgba(238,90,36,0.1);
    border: 1px solid rgba(238,90,36,0.3);
    color: var(--accent2);
    padding: 10px 20px;
    font-size: 13px;
  }

  .btn-reset:hover { background: rgba(238,90,36,0.2); }

  .dots-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 24px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }

  .dot.active   { background: var(--accent); transform: scale(1.3); }
  .dot.answered { background: rgba(0,229,160,0.5); }
  .dot.current  { border-color: var(--accent); }

  .result-screen {
    text-align: center;
    padding: 60px 40px;
  }

  .result-score {
    font-size: 80px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-label {
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 8px;
  }

  .result-msg {
    font-size: 20px;
    font-weight: 600;
    margin-top: 24px;
    margin-bottom: 32px;
  }

  .result-list {
    display: flex;
    gap: 8px;
    flex-direction: column;
    margin-bottom: 32px;
    text-align: left;
    max-width: 360px;
    margin-left: auto;
    margin-right: auto;
  }

  .result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .card { padding: 24px 20px; }
    .question { font-size: 18px; }
    .nav-row { flex-wrap: wrap; }
    .btn-reset { order: -1; width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="badge">AWS Certification Prep</div>
  <h1>Elastic <span>Compute</span> Cloud</h1>
  <p class="subtitle">// 10 questions · EC2 fundamentals</p>
</header>

<div class="quiz-container">
  <div class="progress-bar-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">1 / 10</div>
  </div>

  <div id="quizArea"></div>

  <div class="dots-nav" id="dotsNav"></div>
</div>

<script>
const questions = [
  {
    q: "What is EC2?",
    options: [
      "A managed container orchestration service by AWS",
      "A compute service that provides scalable virtual servers in the cloud",
      "A serverless function execution environment",
      "A content delivery network for static assets"
    ],
    correct: 1,
    explanation: "EC2 (Elastic Compute Cloud) lets you provision virtual servers called instances in minutes. It eliminates the need to buy and manage physical hardware, enabling rapid scaling up or down based on your application's needs."
  },
  {
    q: "What is an AMI?",
    options: [
      "An automated monitoring interface for EC2 health checks",
      "A billing model for reserved EC2 instances",
      "An Amazon Machine Image — a template containing OS and software configuration",
      "An access management identity for EC2 roles"
    ],
    correct: 2,
    explanation: "An AMI (Amazon Machine Image) is a pre-configured template that includes the operating system, application server, and applications. It allows you to launch multiple identical instances quickly and is the foundation for EC2 auto scaling and deployment automation."
  },
  {
    q: "What are EC2 instance types?",
    options: [
      "Pricing tiers: Free, Standard, and Enterprise",
      "Predefined configurations of CPU, memory, storage, and networking",
      "Region-specific hardware variants with different availability",
      "Security classifications determining network isolation level"
    ],
    correct: 1,
    explanation: "Instance types define the hardware profile of your virtual server. Families include T (burstable), M (general purpose), C (compute-optimized), R (memory-optimized), and more. You choose based on your workload — for example, R-series for in-memory databases and C-series for CPU-heavy tasks."
  },
  {
    q: "What is a key pair in EC2?",
    options: [
      "Two EC2 instances configured for active-passive failover",
      "A pair of public/private cryptographic keys used for secure SSH login",
      "A primary and backup Elastic IP address",
      "A dual-region deployment strategy for high availability"
    ],
    correct: 1,
    explanation: "A key pair consists of a public key (stored by AWS) and a private key (.pem file, stored by you). When you connect via SSH, your private key is matched against the public key on the instance — enabling password-less, secure authentication."
  },
  {
    q: "What is EC2 User Data?",
    options: [
      "Metadata about the AWS account that owns the instance",
      "Custom tags assigned to an instance for billing purposes",
      "A script executed automatically at instance launch for bootstrapping",
      "IAM user credentials embedded in the instance profile"
    ],
    correct: 2,
    explanation: "User Data is a shell script (or cloud-init directive) that runs once when the instance first boots. It's commonly used to install software, pull code from repositories, configure services, or run any initialization automation — eliminating manual setup."
  },
  {
    q: "What is EC2 Auto Scaling?",
    options: [
      "A feature that automatically upgrades your instance type based on usage",
      "Automatically adjusts the number of EC2 instances based on demand",
      "A tool that resizes EBS volumes when disk usage is high",
      "An alarm-based feature that changes instance pricing tiers"
    ],
    correct: 1,
    explanation: "Auto Scaling monitors metrics (like CPU utilization) and adds or removes EC2 instances automatically based on scaling policies. It ensures your application maintains performance during traffic spikes while minimizing cost during quiet periods — a core component of high availability architectures."
  },
  {
    q: "What is an Elastic IP address?",
    options: [
      "A dynamic IP assigned fresh on every instance start",
      "A private IP reserved within a VPC subnet",
      "A static public IP address that persists across instance stops and starts",
      "An IPv6 address automatically assigned to all EC2 instances"
    ],
    correct: 2,
    explanation: "An Elastic IP (EIP) is a static, public IPv4 address that you own in your AWS account. Unlike standard public IPs (which change when you stop an instance), an EIP remains fixed and can be remapped to different instances — useful for DNS records, whitelisting, or failover scenarios."
  },
  {
    q: "How do you troubleshoot EC2 connectivity issues?",
    options: [
      "Reboot the instance and wait for AWS support to investigate",
      "Only check the Security Group inbound rules",
      "Check Security Groups, NACLs, route tables, instance state, and IP configuration",
      "Delete and recreate the instance in a different availability zone"
    ],
    correct: 2,
    explanation: "Connectivity issues have multiple potential causes: Security Groups might block inbound/outbound ports, NACLs apply subnet-level stateless rules, route tables must have correct routes (e.g., to an Internet Gateway), the instance must be running, and it must have a public IP or be reachable via a bastion/VPN. Systematic checks at each layer isolate the issue."
  },
  {
    q: "What is the difference between Stop and Terminate for an EC2 instance?",
    options: [
      "Stop and Terminate are identical — both permanently delete the instance",
      "Stop pauses the instance but keeps data; Terminate permanently deletes it",
      "Stop deletes the instance but retains snapshots; Terminate keeps everything",
      "Stop applies only to spot instances; Terminate applies to on-demand"
    ],
    correct: 1,
    explanation: "Stopping an instance shuts it down like powering off a PC — the EBS root volume is preserved, you stop paying for compute, but still pay for storage. Terminating permanently destroys the instance and its root volume (by default). For cost savings without data loss, stop; for full cleanup, terminate."
  },
  {
    q: "What is an EC2 Placement Group?",
    options: [
      "A tag-based grouping for billing and cost allocation",
      "A reserved capacity block in a specific availability zone",
      "A logical grouping that defines how instances are physically placed for latency or fault tolerance",
      "A VPC subnet configuration for organizing EC2 instances"
    ],
    correct: 2,
    explanation: "Placement groups control how EC2 instances are distributed across underlying hardware. Cluster placement groups pack instances close together for ultra-low latency (HPC workloads). Spread placement groups place each instance on distinct hardware to maximize fault tolerance. Partition groups separate instances into isolated racks for distributed systems like Hadoop or Cassandra."
  }
];

let current = 0;
let answers = new Array(questions.length).fill(null);

function render() {
  const q = questions[current];
  const ans = answers[current];
  const isAnswered = ans !== null;
  const total = questions.length;

  document.getElementById('progressFill').style.width = `${((current + 1) / total) * 100}%`;
  document.getElementById('progressText').textContent = `${current + 1} / ${total}`;

  document.getElementById('dotsNav').innerHTML = questions.map((_, i) => {
    let cls = 'dot';
    if (i === current) cls += ' active current';
    else if (answers[i] !== null) cls += ' answered';
    return `<div class="${cls}" onclick="goTo(${i})"></div>`;
  }).join('');

  let optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    let tag = '';
    if (isAnswered) {
      cls += ' locked';
      if (i === q.correct) {
        cls += ' correct';
        tag = `<span class="option-tag tag-correct">✓ CORRECT</span>`;
      } else if (i === ans && ans !== q.correct) {
        cls += ' wrong';
        tag = `<span class="option-tag tag-wrong">✗ WRONG</span>`;
      }
    }
    return `
      <div class="${cls}" onclick="selectAnswer(${i})">
        <div class="option-dot"></div>
        <span class="option-label">${opt}</span>
        ${tag}
      </div>`;
  }).join('');

  const explanationHtml = isAnswered ? `
    <div class="explanation-box">
      <div class="explanation-title">⚡ Explanation</div>
      <div class="explanation-text">${q.explanation}</div>
    </div>` : '';

  const isLast = current === total - 1;
  const allAnswered = answers.every(a => a !== null);

  document.getElementById('quizArea').innerHTML = `
    <div class="card">
      <div class="q-number">Question ${current + 1} of ${total}</div>
      <div class="question">${q.q}</div>
      <div class="options">${optionsHtml}</div>
      ${explanationHtml}
      <div class="nav-row">
        <button class="btn btn-back" onclick="goBack()" ${current === 0 ? 'disabled' : ''}>← Back</button>
        <button class="btn btn-reset" onclick="resetQuiz()">↺ Reset</button>
        ${isLast && allAnswered
          ? `<button class="btn btn-next" onclick="showResults()">See Results →</button>`
          : `<button class="btn btn-next" onclick="goNext()" ${!isAnswered ? 'disabled' : ''}>Next →</button>`
        }
      </div>
    </div>`;
}

function selectAnswer(i) {
  if (answers[current] !== null) return;
  answers[current] = i;
  render();
}

function goNext() {
  if (current < questions.length - 1) { current++; render(); }
}

function goBack() {
  if (current > 0) { current--; render(); }
}

function goTo(i) { current = i; render(); }

function resetQuiz() {
  answers = new Array(questions.length).fill(null);
  current = 0;
  render();
}

function showResults() {
  const score = answers.filter((a, i) => a === questions[i].correct).length;
  const pct = Math.round((score / questions.length) * 100);
  let msg = '';
  if (pct === 100) msg = '🏆 Perfect score! You know EC2 cold!';
  else if (pct >= 70) msg = '🎯 Strong foundation — keep pushing!';
  else msg = '📚 Review the explanations and try again!';

  document.getElementById('quizArea').innerHTML = `
    <div class="card result-screen">
      <div class="result-score">${score}/${questions.length}</div>
      <div class="result-label">FINAL SCORE · ${pct}%</div>
      <div class="result-msg">${msg}</div>
      <div class="result-list">
        ${questions.map((q, i) => `
          <div class="result-item">
            <span style="font-size:16px">${answers[i] === q.correct ? '✅' : '❌'}</span>
            Q${i+1}: ${q.q.length > 42 ? q.q.slice(0, 42) + '…' : q.q}
          </div>`).join('')}
      </div>
      <button class="btn btn-next" style="margin:0 auto" onclick="reviewAnswers()">Review Answers</button>
      <button class="btn btn-reset" style="margin:12px auto 0" onclick="resetQuiz()">↺ Try Again</button>
    </div>`;
  document.getElementById('dotsNav').innerHTML = '';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = `${score} / ${questions.length} correct`;
}

function reviewAnswers() {
  current = 0;
  render();
}

render();
</script>
</body>
</html>
