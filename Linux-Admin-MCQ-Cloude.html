<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Admin Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --card: #111827;
    --border: #1e2d40;
    --accent: #a8ff78;
    --accent2: #22c55e;
    --correct: #00e5a0;
    --wrong: #ff4d6d;
    --text: #e2e8f0;
    --muted: #64748b;
    --highlight: rgba(168,255,120,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px;
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(168,255,120,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(34,197,94,0.05) 0%, transparent 50%);
  }

  header { text-align: center; margin-bottom: 40px; }

  .badge {
    display: inline-block;
    background: rgba(168,255,120,0.1);
    border: 1px solid rgba(168,255,120,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 6px 16px;
    border-radius: 2px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    margin-top: 8px;
    font-size: 14px;
    font-family: 'Space Mono', monospace;
  }

  /* Section tabs */
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .tab {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 8px 18px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }

  .tab:hover { border-color: rgba(168,255,120,0.4); color: var(--text); }

  .tab.active {
    background: rgba(168,255,120,0.1);
    border-color: rgba(168,255,120,0.5);
    color: var(--accent);
  }

  .quiz-container { width: 100%; max-width: 780px; }

  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 40px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.35s ease;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .q-tag {
    display: inline-block;
    background: rgba(168,255,120,0.08);
    border: 1px solid rgba(168,255,120,0.2);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    padding: 2px 8px;
    border-radius: 2px;
    margin-left: 10px;
    vertical-align: middle;
    text-transform: uppercase;
  }

  .q-tag.scenario { background: rgba(255,159,67,0.08); border-color: rgba(255,159,67,0.2); color: #ff9f43; }
  .q-tag.sar { background: rgba(139,92,246,0.08); border-color: rgba(139,92,246,0.2); color: #a78bfa; }

  .question {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.2s ease;
    font-size: 15px;
    line-height: 1.5;
  }

  .option:hover:not(.locked) {
    border-color: rgba(168,255,120,0.4);
    background: var(--highlight);
    transform: translateX(4px);
  }

  .option-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s ease;
  }

  .option.correct { border-color: var(--correct); background: rgba(0,229,160,0.06); }
  .option.correct .option-dot { border-color: var(--correct); background: var(--correct); }
  .option.wrong   { border-color: var(--wrong); background: rgba(255,77,109,0.06); }
  .option.wrong .option-dot { border-color: var(--wrong); background: var(--wrong); }

  .option-label { flex: 1; }

  .option-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    margin-left: auto;
    flex-shrink: 0;
    align-self: center;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .tag-correct { background: rgba(0,229,160,0.15); color: var(--correct); }
  .tag-wrong   { background: rgba(255,77,109,0.15); color: var(--wrong); }

  .explanation-box {
    margin-top: 20px;
    padding: 16px 20px;
    background: rgba(168,255,120,0.03);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .explanation-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .explanation-text { font-size: 14px; color: #94a3b8; line-height: 1.6; }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    padding: 12px 28px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-back { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-back:hover { border-color: rgba(168,255,120,0.4); color: var(--text); }
  .btn-back:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-next {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    box-shadow: 0 4px 20px rgba(168,255,120,0.15);
  }

  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(168,255,120,0.3); }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-reset {
    background: rgba(34,197,94,0.08);
    border: 1px solid rgba(34,197,94,0.25);
    color: var(--accent2);
    padding: 10px 20px;
    font-size: 13px;
  }

  .btn-reset:hover { background: rgba(34,197,94,0.15); }

  .dots-nav {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 24px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }

  .dot.active   { background: var(--accent); transform: scale(1.35); }
  .dot.answered { background: rgba(0,229,160,0.5); }
  .dot.current  { border-color: var(--accent); }

  .result-screen { text-align: center; padding: 50px 40px; }

  .result-score {
    font-size: 80px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-label {
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 8px;
  }

  .result-msg { font-size: 20px; font-weight: 600; margin-top: 24px; margin-bottom: 32px; }

  .result-list {
    display: flex;
    gap: 8px;
    flex-direction: column;
    margin-bottom: 32px;
    text-align: left;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  .result-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }

  @media (max-width: 560px) {
    .card { padding: 24px 20px; }
    .question { font-size: 17px; }
    .nav-row { flex-wrap: wrap; }
    .btn-reset { order: -1; width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="badge">Linux Administration Prep</div>
  <h1>Linux <span>Admin</span> Quiz</h1>
  <p class="subtitle">// 55 questions · Core + Scenarios + SAR</p>
</header>

<div class="quiz-container">

  <div class="tabs" id="tabsRow">
    <button class="tab active" onclick="switchSection(0)">Core (1–30)</button>
    <button class="tab" onclick="switchSection(1)">Scenarios (31–35)</button>
    <button class="tab" onclick="switchSection(2)">SAR Tool (1–20)</button>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <div id="quizArea"></div>
  <div class="dots-nav" id="dotsNav"></div>
</div>

<script>
const sections = [
  {
    label: "Core Linux",
    questions: [
      {
        q: "What is Linux?",
        tag: "core",
        options: [
          "A proprietary OS developed by Microsoft",
          "An open-source OS based on Unix architecture that manages hardware resources and provides services to applications",
          "A cloud platform for deploying containers",
          "A command-line utility for network management"
        ],
        correct: 1,
        explanation: "Linux is an open-source, Unix-inspired operating system widely used in servers, cloud environments, and containers because of its stability, security, and flexibility. It's the backbone of most modern infrastructure."
      },
      {
        q: "What is the Linux kernel?",
        tag: "core",
        options: [
          "A graphical desktop environment",
          "A file compression utility",
          "The core component that interacts directly with hardware and manages CPU, memory, and devices",
          "A package manager for installing software"
        ],
        correct: 2,
        explanation: "The kernel is the heart of Linux — it acts as a bridge between applications and hardware, managing system resources like CPU scheduling, memory allocation, and device drivers."
      },
      {
        q: "What is the key difference between Linux and Unix?",
        tag: "core",
        options: [
          "Linux is older than Unix",
          "Unix is open-source; Linux is proprietary",
          "Linux is open-source and free; Unix is proprietary",
          "There is no functional difference"
        ],
        correct: 2,
        explanation: "Unix is a proprietary, commercial OS. Linux was inspired by Unix but developed independently by Linus Torvalds starting in 1991. Linux is free, open-source, and has become the dominant OS in servers and cloud."
      },
      {
        q: "What is a shell in Linux?",
        tag: "core",
        options: [
          "A hardware abstraction layer",
          "A command-line interface that allows users to interact with the OS",
          "A background service process",
          "A tool for monitoring disk I/O"
        ],
        correct: 1,
        explanation: "The shell is a program that reads user commands and passes them to the OS kernel for execution. Common shells include bash, sh, and zsh. It's the primary interface for system administration tasks."
      },
      {
        q: "What is a process in Linux?",
        tag: "core",
        options: [
          "A file stored in the /proc directory",
          "A scheduled cron job",
          "A running instance of a program with a unique PID",
          "A type of Linux kernel module"
        ],
        correct: 2,
        explanation: "A process is an active execution instance of a program. Each process is assigned a unique PID (Process ID) and consumes system resources like CPU and memory. The OS scheduler manages process execution."
      },
      {
        q: "What is the difference between a process and a thread?",
        tag: "core",
        options: [
          "They are identical — threads are just renamed processes",
          "A process is a lightweight unit inside a thread",
          "A process is an independent execution unit; a thread is a lightweight unit within a process",
          "Threads run in foreground; processes run in background"
        ],
        correct: 2,
        explanation: "Processes have their own memory space and run independently. Threads are lighter units within a process that share the same memory space, enabling more efficient parallel execution within a single application."
      },
      {
        q: "What is a PID?",
        tag: "core",
        options: [
          "Partition Identifier — used to label disk partitions",
          "Package Install Directory — path where packages are stored",
          "Process ID — a unique identifier assigned to each running process",
          "Primary Interface Device — network interface name"
        ],
        correct: 2,
        explanation: "PID stands for Process ID. Every running process gets a unique integer PID assigned by the OS. You use PIDs to send signals to processes (e.g., kill 1234) and manage them via commands like ps or top."
      },
      {
        q: "What is the difference between foreground and background processes?",
        tag: "core",
        options: [
          "Foreground uses more CPU; background uses less",
          "Foreground runs in the terminal and blocks input; background runs without blocking the terminal",
          "Background processes have higher priority than foreground",
          "They differ only in their PID range"
        ],
        correct: 1,
        explanation: "A foreground process occupies the terminal — you can't run other commands until it finishes. A background process (started with & or moved with bg) runs independently, allowing you to keep using the terminal for multitasking."
      },
      {
        q: "How do you check running processes in Linux?",
        tag: "core",
        options: [
          "Using ls -lh or find /proc",
          "Using df, du, or lsblk",
          "Using ps, top, or htop",
          "Using journalctl or dmesg"
        ],
        correct: 2,
        explanation: "ps gives a snapshot of running processes, top provides a real-time interactive view of processes sorted by resource usage, and htop is an enhanced version of top with a more user-friendly interface and color coding."
      },
      {
        q: "How do you forcefully kill a process in Linux?",
        tag: "core",
        options: [
          "Using rm -rf /proc/<PID>",
          "Using stop <PID> or halt <PID>",
          "Using kill, kill -9 <PID>, or pkill <name>",
          "Using systemctl pause <PID>"
        ],
        correct: 2,
        explanation: "kill <PID> sends SIGTERM (graceful termination). kill -9 <PID> sends SIGKILL (immediate, cannot be caught or ignored). pkill allows you to kill by process name. Use -9 only for unresponsive processes."
      },
      {
        q: "What is a Linux file system?",
        tag: "core",
        options: [
          "A GUI tool for browsing files",
          "A structure used to store and organize files, starting from the root /",
          "A backup mechanism for data recovery",
          "A network protocol for file sharing"
        ],
        correct: 1,
        explanation: "A file system organizes how data is stored on disk. Linux uses a hierarchical tree structure with / as the root. Common Linux file systems include ext4, xfs, and btrfs. Everything in Linux — including devices and processes — is represented as a file."
      },
      {
        q: "What is an inode in Linux?",
        tag: "core",
        options: [
          "A type of Linux network interface",
          "A special root-level directory",
          "A data structure that stores metadata about a file (permissions, size, timestamps) but not the filename",
          "A physical sector on a hard disk"
        ],
        correct: 2,
        explanation: "An inode holds all file metadata: size, owner, permissions, timestamps, and pointers to data blocks. Notably, it does NOT store the filename — that's stored in the directory entry. Hard links share the same inode."
      },
      {
        q: "What are Linux file permissions?",
        tag: "core",
        options: [
          "Encrypted tokens used for SSH authentication",
          "ACLs that define read (r), write (w), and execute (x) access for user, group, and others",
          "Flags stored in the kernel for process scheduling",
          "Settings in /etc/passwd for user login"
        ],
        correct: 1,
        explanation: "Linux file permissions control who can read, write, or execute a file. They are split into three classes: owner (user), group, and others. Shown as rwxrwxrwx in ls -l output, each class gets 3 bits representing r, w, and x."
      },
      {
        q: "What does the chmod command do?",
        tag: "core",
        options: [
          "Changes the hostname of the system",
          "Modifies memory allocation for a process",
          "Changes file or directory permissions",
          "Checks file system integrity"
        ],
        correct: 2,
        explanation: "chmod (change mode) modifies the access permissions of files and directories. You can use symbolic mode (chmod u+x file) or octal mode (chmod 755 file). It's essential for security and access control."
      },
      {
        q: "What does the chown command do?",
        tag: "core",
        options: [
          "Changes the current working directory",
          "Changes the owner and/or group of a file or directory",
          "Checks for open ports on a network interface",
          "Creates a new user on the system"
        ],
        correct: 1,
        explanation: "chown (change owner) assigns a new user and/or group to files and directories. Example: chown alice:developers file.txt changes the owner to 'alice' and group to 'developers'. Requires root or sudo privileges."
      },
      {
        q: "What is sudo in Linux?",
        tag: "core",
        options: [
          "A background daemon for user authentication",
          "A network tool for superuser diagnostics",
          "A command that allows permitted users to run commands as root with controlled access",
          "A shell built-in for switching user environments"
        ],
        correct: 2,
        explanation: "sudo (superuser do) lets authorized users execute commands with elevated (root) privileges without logging in as root. It logs all actions for auditing and is configured via /etc/sudoers, providing granular access control."
      },
      {
        q: "What is the root user in Linux?",
        tag: "core",
        options: [
          "The first user created during OS installation (UID 1000)",
          "A user with read-only access to system files",
          "The superuser with UID 0 and full, unrestricted system access",
          "An AWS IAM role mapped to Linux"
        ],
        correct: 2,
        explanation: "The root user (UID 0) has complete control over the system — no file permissions or restrictions apply. Root should be used carefully to avoid accidental damage. Best practice: use sudo for administrative tasks instead of logging in as root."
      },
      {
        q: "What is a daemon in Linux?",
        tag: "core",
        options: [
          "A malicious background process",
          "A background service process that runs continuously without user interaction",
          "A type of shell script that runs at login",
          "A kernel module loaded at boot time"
        ],
        correct: 1,
        explanation: "Daemons are background processes that provide system services. They typically start at boot and run continuously. Examples include sshd (SSH server), crond (job scheduler), httpd (web server), and ntpd (time sync)."
      },
      {
        q: "What is cron in Linux?",
        tag: "core",
        options: [
          "A real-time process monitor",
          "A command for counting lines in a file",
          "A time-based job scheduler used for automating repetitive tasks",
          "A filesystem consistency checker"
        ],
        correct: 2,
        explanation: "Cron is a daemon that executes scheduled commands at specified times. Jobs are defined in crontab files using the format: minute hour day month weekday command. It's essential for automating backups, log rotation, and maintenance tasks."
      },
      {
        q: "What does systemctl do?",
        tag: "core",
        options: [
          "Monitors system call activity in real time",
          "Manages services and units in systemd — start, stop, enable, disable, status",
          "Synchronizes system time with NTP servers",
          "Checks CPU temperature and fan speed"
        ],
        correct: 1,
        explanation: "systemctl is the main tool for interacting with systemd. Common commands: systemctl start/stop/restart <service>, systemctl enable/disable (persist across reboots), systemctl status (check current state and recent logs)."
      },
      {
        q: "What is systemd?",
        tag: "core",
        options: [
          "A shell scripting language for automation",
          "A disk partitioning and formatting tool",
          "A system and service manager that handles the boot process, service lifecycle, and logging",
          "A kernel security module for SELinux"
        ],
        correct: 2,
        explanation: "systemd is the init system and service manager used by most modern Linux distributions. It replaces older init systems (SysV init), manages services in parallel during boot for faster startup, and provides journald for centralized logging."
      },
      {
        q: "What is a package manager in Linux?",
        tag: "core",
        options: [
          "A tool for compressing and archiving files",
          "A network traffic analyzer",
          "A tool to install, update, and manage software packages and dependencies",
          "A daemon that manages background processes"
        ],
        correct: 2,
        explanation: "Package managers automate software installation and dependency resolution. Common ones: apt/apt-get (Debian/Ubuntu), yum/dnf (RHEL/CentOS/Fedora), zypper (openSUSE). They fetch packages from repositories and maintain an installed package database."
      },
      {
        q: "What is SSH?",
        tag: "core",
        options: [
          "Simple Shell Handler — a local command interpreter",
          "Secure Shell — a cryptographic network protocol for secure remote login and command execution",
          "System Service Host — a Windows compatibility layer",
          "Stateful Session Handler — a web session protocol"
        ],
        correct: 1,
        explanation: "SSH (Secure Shell) provides encrypted communication over an insecure network. It replaced older protocols like Telnet. It uses asymmetric key pairs for authentication and symmetric encryption for the session, running on port 22 by default."
      },
      {
        q: "What does the grep command do?",
        tag: "core",
        options: [
          "Generates reports on process execution",
          "Groups files by extension for batch processing",
          "Searches for text patterns within files or input streams using regular expressions",
          "Gets the real-time path of a running executable"
        ],
        correct: 2,
        explanation: "grep (Global Regular Expression Print) scans files or stdin for lines matching a pattern and prints them. Extremely useful for log analysis, filtering command output, and searching codebases. Common flags: -i (case insensitive), -r (recursive), -v (invert match)."
      },
      {
        q: "What is awk used for?",
        tag: "core",
        options: [
          "Auditing kernel write operations",
          "A text processing tool used for parsing and transforming structured data",
          "Archiving files with compression",
          "A network packet analyzer"
        ],
        correct: 1,
        explanation: "awk is a powerful text processing language that processes input line by line, splitting each into fields. It's ideal for log parsing, report generation, and data extraction. Example: awk '{print $1, $3}' file.txt prints columns 1 and 3."
      },
      {
        q: "What is sed in Linux?",
        tag: "core",
        options: [
          "A secure encryption daemon for file protection",
          "A storage error detector for disk diagnostics",
          "A stream editor used for modifying text in files or pipelines",
          "A service dependency manager for systemd"
        ],
        correct: 2,

let currentSection = 0;
let current = 0;
let sectionAnswers = sections.map(s => new Array(s.questions.length).fill(null));

function switchSection(idx) {
  currentSection = idx;
  current = 0;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  render();
}

function render() {
  const sec = sections[currentSection];
  const q = sec.questions[current];
  const answers = sectionAnswers[currentSection];
  const ans = answers[current];
  const isAnswered = ans !== null;
  const total = sec.questions.length;

  document.getElementById('progressFill').style.width = `${((current + 1) / total) * 100}%`;
  document.getElementById('progressText').textContent = `${current + 1} / ${total}`;

  const tagLabels = { core: 'Core', scenario: '🔥 Scenario', sar: 'SAR' };
  const tagClass = q.tag === 'scenario' ? 'scenario' : q.tag === 'sar' ? 'sar' : '';

  document.getElementById('dotsNav').innerHTML = sec.questions.map((_, i) => {
    let cls = 'dot';
    if (i === current) cls += ' active current';
    else if (answers[i] !== null) cls += ' answered';
    return `<div class="${cls}" onclick="goTo(${i})"></div>`;
  }).join('');

  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    let tag = '';
    if (isAnswered) {
      cls += ' locked';
      if (i === q.correct) { cls += ' correct'; tag = `<span class="option-tag tag-correct">✓ CORRECT</span>`; }
      else if (i === ans) { cls += ' wrong'; tag = `<span class="option-tag tag-wrong">✗ WRONG</span>`; }
    }
    return `<div class="${cls}" onclick="selectAnswer(${i})">
      <div class="option-dot"></div>
      <span class="option-label">${opt}</span>${tag}
    </div>`;
  }).join('');

  const explanationHtml = isAnswered ? `
    <div class="explanation-box">
      <div class="explanation-title">⚡ Explanation</div>
      <div class="explanation-text">${q.explanation}</div>
    </div>` : '';

  const isLast = current === total - 1;
  const allAnswered = answers.every(a => a !== null);

  document.getElementById('quizArea').innerHTML = `
    <div class="card">
      <div class="q-number">Question ${current + 1} of ${total}<span class="q-tag ${tagClass}">${tagLabels[q.tag]}</span></div>
      <div class="question">${q.q}</div>
      <div class="options">${optionsHtml}</div>
      ${explanationHtml}
      <div class="nav-row">
        <button class="btn btn-back" onclick="goBack()" ${current === 0 ? 'disabled' : ''}>← Back</button>
        <button class="btn btn-reset" onclick="resetSection()">↺ Reset</button>
        ${isLast && allAnswered
          ? `<button class="btn btn-next" onclick="showResults()">See Results →</button>`
          : `<button class="btn btn-next" onclick="goNext()" ${!isAnswered ? 'disabled' : ''}>Next →</button>`
        }
      </div>
    </div>`;
}

function selectAnswer(i) {
  if (sectionAnswers[currentSection][current] !== null) return;
  sectionAnswers[currentSection][current] = i;
  render();
}

function goNext() { if (current < sections[currentSection].questions.length - 1) { current++; render(); } }
function goBack() { if (current > 0) { current--; render(); } }
function goTo(i) { current = i; render(); }

function resetSection() {
  sectionAnswers[currentSection] = new Array(sections[currentSection].questions.length).fill(null);
  current = 0;
  render();
}

function showResults() {
  const sec = sections[currentSection];
  const answers = sectionAnswers[currentSection];
  const score = answers.filter((a, i) => a === sec.questions[i].correct).length;
  const total = sec.questions.length;
  const pct = Math.round((score / total) * 100);
  let msg = pct === 100 ? '🏆 Perfect! You nailed it!' : pct >= 70 ? '🎯 Strong work — nearly there!' : '📚 Review explanations and retry!';

  document.getElementById('quizArea').innerHTML = `
    <div class="card result-screen">
      <div class="result-score">${score}/${total}</div>
      <div class="result-label">SCORE · ${sec.label.toUpperCase()} · ${pct}%</div>
      <div class="result-msg">${msg}</div>
      <div class="result-list">
        ${sec.questions.map((q, i) => `
          <div class="result-item">
            <span style="font-size:15px">${answers[i] === q.correct ? '✅' : '❌'}</span>
            Q${i+1}: ${q.q.length > 46 ? q.q.slice(0, 46) + '…' : q.q}
          </div>`).join('')}
      </div>
      <button class="btn btn-next" style="margin:0 auto" onclick="reviewAnswers()">Review Answers</button>
      <button class="btn btn-reset" style="margin:12px auto 0" onclick="resetSection()">↺ Try Again</button>
    </div>`;
  document.getElementById('dotsNav').innerHTML = '';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = `${score} / ${total} correct`;
}

function reviewAnswers() { current = 0; render(); }

render();
</script>
