<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker & Docker Compose — MCQ Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface2: #f7f9fc;
  --border: #d0d8e8;
  --accent: #0a6cc4;
  --accent2: #0550a0;
  --accent3: #0c2340;
  --whale: #1d94d2;
  --compose: #e05a1a;
  --compose2: #b84010;
  --text: #111826;
  --text-muted: #4a5770;
  --correct: #1a7a4a;
  --correct-bg: #edf7f2;
  --wrong: #b83020;
  --wrong-bg: #fdf0ee;
  --option-hover: #e8f2fc;
  --shadow: 0 4px 28px rgba(10,30,70,0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: 'Crimson Pro', Georgia, serif; color: var(--text); min-height: 100vh; }

/* ── HEADER ── */
header {
  background: var(--accent3);
  padding: 0;
  position: relative;
  overflow: hidden;
}
header::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -55deg,
    transparent,
    transparent 28px,
    rgba(255,255,255,0.025) 28px,
    rgba(255,255,255,0.025) 29px
  );
  pointer-events: none;
}
.header-inner {
  position: relative;
  z-index: 1;
  padding: 48px 44px 36px;
  display: flex;
  align-items: flex-end;
  gap: 40px;
  flex-wrap: wrap;
}
.docker-whale {
  font-size: 72px;
  line-height: 1;
  filter: drop-shadow(0 4px 18px rgba(29,148,210,0.5));
  flex-shrink: 0;
}
.header-text .label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-bottom: 8px;
}
.header-text h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 6vw, 72px);
  letter-spacing: 2px;
  color: #fff;
  line-height: 0.95;
}
.header-text h1 span { color: var(--whale); }
.header-text h1 em { color: var(--compose); font-style: normal; }
.header-text p {
  margin-top: 12px;
  font-size: 15px;
  color: rgba(255,255,255,0.6);
  font-style: italic;
}

/* ── TABS ── */
.tab-bar {
  background: var(--accent3);
  border-bottom: 2px solid rgba(255,255,255,0.08);
  display: flex;
  padding: 0 44px;
  gap: 0;
  position: sticky;
  top: 0;
  z-index: 200;
}
.tab-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  padding: 16px 28px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  position: relative;
  top: 2px;
}
.tab-btn:hover { color: rgba(255,255,255,0.8); }
.tab-btn.active-docker { color: var(--whale); border-bottom-color: var(--whale); }
.tab-btn.active-compose { color: var(--compose); border-bottom-color: var(--compose); }
.tab-btn .tab-count {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 99px;
  margin-left: 8px;
  background: rgba(255,255,255,0.1);
}

/* ── PROGRESS ── */
.progress-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 44px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 10px rgba(10,30,70,0.06);
}
.progress-bar-bg {
  flex: 1;
  height: 5px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  width: 0%;
}
.fill-docker { background: linear-gradient(90deg, var(--accent2), var(--whale)); }
.fill-compose { background: linear-gradient(90deg, var(--compose2), var(--compose)); }
.progress-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
}
.score-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 1px;
  padding: 4px 16px;
  border-radius: 6px;
  white-space: nowrap;
}
.badge-docker { background: var(--accent3); color: var(--whale); }
.badge-compose { background: var(--accent3); color: var(--compose); }

/* ── MAIN ── */
main { max-width: 860px; margin: 0 auto; padding: 44px 20px 80px; }

.quiz-section { display: none; }
.quiz-section.active { display: block; }

/* ── CATEGORY DIVIDER ── */
.category-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 44px 0 22px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  color: var(--text-muted);
}
.category-divider::before, .category-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.category-divider .cat-icon { font-size: 16px; }

/* ── QUESTION CARD ── */
.question-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 34px 36px 26px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
  animation: cardIn 0.35s ease both;
  display: none;
  border-top: 4px solid var(--border);
}
.question-card.active { display: block; }
.question-card.docker-card { border-top-color: var(--whale); }
.question-card.compose-card { border-top-color: var(--compose); }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.q-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
.q-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  padding: 3px 10px;
  border-radius: 4px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.q-tag.basic { background: #e0ecff; color: #0a4a9c; }
.q-tag.advanced { background: #ede0ff; color: #5b2fa0; }
.q-tag.security { background: #ffe0e0; color: #a02020; }
.q-tag.scenario { background: #fff3d6; color: #8a5500; }
.q-tag.compose { background: #ffeadc; color: #b84010; }
.q-tag.network { background: #dcf5e8; color: #0a5a30; }

.question-text { font-size: 19px; line-height: 1.6; color: var(--text); margin-bottom: 6px; }

.q-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  background: #0c1929;
  color: #7dd3fc;
  padding: 14px 18px;
  border-radius: 8px;
  margin: 14px 0 4px;
  border-left: 3px solid var(--whale);
  overflow-x: auto;
  white-space: pre;
  line-height: 1.75;
}
.q-code.compose-code { color: #fdba74; border-left-color: var(--compose); }

/* ── OPTIONS ── */
.options { display: flex; flex-direction: column; gap: 9px; margin-top: 20px; }
.option {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 13px 18px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: var(--surface2);
  transition: all 0.16s ease;
  user-select: none;
}
.option:hover:not(.disabled) { border-color: var(--accent); background: var(--option-hover); transform: translateX(4px); }
.option-key {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 1px;
  min-width: 28px;
  height: 28px;
  border-radius: 5px;
  background: var(--border);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.16s;
}
.option-text { font-size: 15.5px; line-height: 1.55; padding-top: 3px; }
.option-code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 4px; }

.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.correct .option-key { background: var(--correct); color: #fff; }
.option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.option.wrong .option-key { background: var(--wrong); color: #fff; }
.option.disabled { cursor: default; transform: none !important; }

/* ── EXPLANATION ── */
.explanation {
  display: none;
  margin-top: 18px;
  padding: 18px 20px;
  border-radius: 8px;
  animation: fadeUp 0.3s ease;
}
.explanation.show { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.exp-docker { border-left: 4px solid var(--whale); background: #e8f4fd; }
.exp-compose { border-left: 4px solid var(--compose); background: #fdf0e8; }
.explanation .ex-head {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.exp-docker .ex-head { color: var(--accent2); }
.exp-compose .ex-head { color: var(--compose2); }
.explanation p { font-size: 14.5px; line-height: 1.72; color: #1a2840; }
.explanation .correct-label {
  display: inline-block;
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 4px;
  margin-bottom: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.exp-docker .correct-label { background: var(--correct); }
.exp-compose .correct-label { background: var(--compose2); }
.explanation .ex-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  background: #0c1929;
  color: #7dd3fc;
  padding: 12px 16px;
  border-radius: 6px;
  margin-top: 10px;
  overflow-x: auto;
  white-space: pre;
  line-height: 1.7;
}
.exp-compose .ex-code { color: #fdba74; }

/* ── NAV BUTTONS ── */
.nav-btns { display: flex; gap: 12px; margin-top: 22px; justify-content: flex-end; }
.btn {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  padding: 12px 32px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.18s;
}
.btn-docker { background: var(--accent3); color: var(--whale); }
.btn-docker:hover { background: #0a1e38; transform: translateY(-1px); }
.btn-compose { background: var(--compose2); color: #fff; }
.btn-compose:hover { background: #8a2e0a; transform: translateY(-1px); }
.btn-outline-docker { background: transparent; color: var(--accent2); border: 1.5px solid var(--accent2); }
.btn-outline-docker:hover { background: var(--option-hover); }

/* ── RESULT ── */
.result-screen {
  display: none;
  text-align: center;
  padding: 60px 20px 80px;
  animation: cardIn 0.5s ease both;
}
.result-screen.show { display: block; }
.result-icon { font-size: 60px; margin-bottom: 12px; }
.result-score-big {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 90px;
  line-height: 1;
  letter-spacing: 3px;
}
.result-score-big span { font-size: 48px; }
.result-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; margin: 14px 0 8px; }
.result-subtitle { font-size: 17px; color: var(--text-muted); font-style: italic; margin-bottom: 36px; }
.result-stats { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
.stat-box { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 20px 28px; min-width: 130px; }
.stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 2px; }
.stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-top: 4px; }

/* ── BOTH RESULTS PANEL ── */
.both-results {
  display: none;
  max-width: 860px;
  margin: 40px auto 80px;
  padding: 0 20px;
  animation: cardIn 0.5s ease both;
}
.both-results.show { display: block; }
.both-results h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  letter-spacing: 3px;
  text-align: center;
  color: var(--accent3);
  margin-bottom: 28px;
}
.results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.result-card {
  border-radius: 12px;
  padding: 28px;
  text-align: center;
}
.result-card.docker-result { background: linear-gradient(135deg, var(--accent3), #1a3a5c); color: #fff; }
.result-card.compose-result { background: linear-gradient(135deg, var(--compose2), #8a3010); color: #fff; }
.result-card .rc-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.65; margin-bottom: 8px; }
.result-card .rc-score { font-family: 'Bebas Neue', sans-serif; font-size: 64px; letter-spacing: 2px; line-height: 1; }
.result-card .rc-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; margin-top: 10px; opacity: 0.9; }
.result-card .rc-sub { font-size: 13px; opacity: 0.7; font-style: italic; margin-top: 6px; }
.restart-row { text-align: center; margin-top: 32px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

@media (max-width: 640px) {
  .header-inner { padding: 32px 20px 24px; }
  .tab-bar { padding: 0 16px; }
  .progress-wrap { padding: 12px 16px; }
  main { padding: 28px 12px 60px; }
  .question-card { padding: 22px 16px 18px; }
  .results-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="docker-whale">🐳</div>
    <div class="header-text">
      <div class="label">DevOps / SRE / Cloud Interview Prep</div>
      <h1><span>Docker</span> &amp; <em>Compose</em><br>MCQ Quiz</h1>
      <p>60 questions across two quiz sets · Basic to Advanced · With examples &amp; explanations</p>
    </div>
  </div>
</header>

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active-docker" id="tab-docker" onclick="switchTab('docker')">
    🐳 Docker <span class="tab-count" id="count-docker">30 Q</span>
  </button>
  <button class="tab-btn" id="tab-compose" onclick="switchTab('compose')">
    🔧 Docker Compose <span class="tab-count" id="count-compose">30 Q</span>
  </button>
</div>

<!-- PROGRESS BAR -->
<div class="progress-wrap">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill fill-docker" id="progress-fill"></div>
  </div>
  <div class="progress-label" id="progress-label">0 / 30</div>
  <div class="score-badge badge-docker" id="score-badge">Score: 0</div>
</div>

<main>
  <!-- DOCKER SECTION -->
  <div class="quiz-section active" id="section-docker"></div>
  <!-- COMPOSE SECTION -->
  <div class="quiz-section" id="section-compose"></div>

  <!-- BOTH COMPLETE RESULTS -->
  <div class="both-results" id="both-results">
    <h2>🏁 Final Results</h2>
    <div class="results-grid">
      <div class="result-card docker-result">
        <div class="rc-label">Docker Core</div>
        <div class="rc-score" id="br-docker-score">—</div>
        <div class="rc-title" id="br-docker-title"></div>
        <div class="rc-sub" id="br-docker-sub"></div>
      </div>
      <div class="result-card compose-result">
        <div class="rc-label">Docker Compose</div>
        <div class="rc-score" id="br-compose-score">—</div>
        <div class="rc-title" id="br-compose-title"></div>
        <div class="rc-sub" id="br-compose-sub"></div>
      </div>
    </div>
    <div class="restart-row">
      <button class="btn btn-docker" onclick="restartAll()">Restart Both Quizzes</button>
      <button class="btn btn-outline-docker" onclick="restartSection('docker')">Retry Docker</button>
      <button class="btn btn-compose" onclick="restartSection('compose')">Retry Compose</button>
    </div>
  </div>
</main>

<script>
// ════════════════════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════════════════════
const dockerQuestions = [
  // ── ARCHITECTURE & CORE ─────────────────────────────────
  {
    category:"Architecture & Core", catIcon:"🏗",
    tag:"basic",
    text:"What is the key difference between a Docker container and a Virtual Machine?",
    options:["Containers include a full OS kernel; VMs do not","Containers share the host OS kernel; VMs have their own OS","Containers are slower than VMs","VMs can only run on Linux"],
    answer:1,
    explanation:"<strong>Containers</strong> share the host OS kernel and isolate processes using namespaces and cgroups — making them lightweight and fast to start. <strong>VMs</strong> virtualise full hardware stacks including separate OS kernels, making them heavier but more isolated.",
    code:"# Container starts in milliseconds\ndocker run -d nginx\n\n# VM needs full OS boot — seconds to minutes\n# Container: ~15 MB overhead  |  VM: ~500 MB–several GB overhead"
  },
  {
    category:"Architecture & Core", catIcon:"🏗",
    tag:"basic",
    text:"Which component is the heart of Docker — the daemon that manages images, containers, networks, and volumes?",
    options:["Docker CLI","Docker Engine (dockerd)","Docker Hub","containerd"],
    answer:1,
    explanation:"<strong>Docker Engine (dockerd)</strong> is the long-running daemon process. The Docker CLI communicates with it via REST API. containerd is the lower-level container runtime that dockerd delegates to.",
    code:"# Check Docker daemon status\nsystemctl status docker\n\n# Docker architecture layers:\n# docker CLI → dockerd → containerd → runc → container"
  },
  {
    category:"Architecture & Core", catIcon:"🏗",
    tag:"advanced",
    text:"Which Linux kernel features does Docker primarily rely on for container isolation?",
    options:["SELinux and AppArmor only","Namespaces and cgroups","Hypervisor and QEMU","iptables and nftables only"],
    answer:1,
    explanation:"<strong>Namespaces</strong> provide isolation (PID, NET, IPC, UTS, Mount, User namespaces). <strong>cgroups</strong> (control groups) limit and account for resource usage (CPU, memory, I/O). Together they make containers possible without a hypervisor.",
    code:"# View namespaces of a running container\nlsns -p $(docker inspect --format='{{.State.Pid}}' mycontainer)\n\n# View cgroup limits\ncat /sys/fs/cgroup/memory/docker/<id>/memory.limit_in_bytes"
  },
  {
    category:"Architecture & Core", catIcon:"🏗",
    tag:"basic",
    text:"What is a Docker image?",
    options:["A running instance of an application","A read-only layered template used to create containers","A backup of a running container","A Docker Hub account snapshot"],
    answer:1,
    explanation:"A <strong>Docker image</strong> is a read-only, layered filesystem built from a Dockerfile. Each instruction creates a new layer. Containers are created by adding a writable layer on top of an image.",
    code:"# Images are layered — each Dockerfile instruction = one layer\ndocker image history nginx\n# IMAGE    CREATED    CREATED BY                 SIZE\n# abc123   2 days ago /bin/sh -c apt-get install  52MB\n# ..."

  // ── DOCKERFILE ──────────────────────────────────────────
  {
    category:"Dockerfile", catIcon:"📄",
    tag:"basic",
    text:"What is the difference between <code class='option-code'>CMD</code> and <code class='option-code'>ENTRYPOINT</code> in a Dockerfile?",
    options:[
      "They are identical — either can be used interchangeably",
      "ENTRYPOINT sets the fixed executable; CMD provides default arguments that can be overridden",
      "CMD sets the fixed executable; ENTRYPOINT provides overridable defaults",
      "ENTRYPOINT runs at build time; CMD runs at container start"
    ],
    answer:1,
    explanation:"<strong>ENTRYPOINT</strong> defines the main command that always runs. <strong>CMD</strong> provides default arguments to ENTRYPOINT (or a default command if ENTRYPOINT is absent). CMD is easily overridden at <code>docker run</code>; ENTRYPOINT requires <code>--entrypoint</code> to override.",
    code:"# Dockerfile\nENTRYPOINT [\"python\", \"app.py\"]\nCMD [\"--port\", \"8080\"]         # default arg\n\n# docker run myimage              → python app.py --port 8080\n# docker run myimage --port 9090  → python app.py --port 9090"
  },
  {
    category:"Dockerfile", catIcon:"📄",
    tag:"basic",
    text:"What is the difference between <code class='option-code'>COPY</code> and <code class='option-code'>ADD</code> in a Dockerfile?",
    options:[
      "COPY is for remote URLs; ADD is for local files",
      "COPY only copies local files; ADD also supports URLs and auto-extracts tar archives",
      "ADD is deprecated — never use it",

    answer:1,

    code:"# Preferred — explicit and fast\nCOPY app.py /app/\n\n# Use ADD only when you need auto-extract:\nADD https://example.com/data.tar.gz /data/\n# ↑ extracts tar.gz automatically"

  {
    category:"Dockerfile", catIcon:"📄",
    tag:"advanced",
    text:"What is a multi-stage build in Docker and why is it used?",
    options:[
      "Running multiple containers in a single build command",
      "Using multiple FROM instructions to reduce final image size by copying only needed artifacts",
      "Building images in parallel across multiple hosts",
      "A Dockerfile with more than 10 RUN instructions"
    ],

// ════════════════════════════════════════════════════════════
//  BUILD
// ════════════════════════════════════════════════════════════
function buildSection(qs, sectionId, tabType) {
  const section = document.getElementById(sectionId);
  section.innerHTML = '';
  let lastCat = '';

  qs.forEach((q, i) => {
    if (q.category !== lastCat) {
      const div = document.createElement('div');
      div.className = 'category-divider';
      div.id = `cat-${tabType}-${i}`;
      div.innerHTML = `<span class="cat-icon">${q.catIcon}</span> ${q.category}`;
      div.style.display = i === 0 ? 'flex' : 'none';
      section.appendChild(div);
      lastCat = q.category;
    }

    const card = document.createElement('div');
    card.className = `question-card ${tabType}-card` + (i === 0 ? ' active' : '');
    card.id = `q-${tabType}-${i}`;

    const tagClass = q.tag === 'advanced' ? 'advanced' : q.tag === 'security' ? 'security' : q.tag === 'scenario' ? 'scenario' : q.tag === 'network' ? 'network' : q.tag === 'compose' ? 'compose' : 'basic';
    const codeClass = tabType === 'compose' ? 'q-code compose-code' : 'q-code';
    const expClass = tabType === 'compose' ? 'explanation exp-compose' : 'explanation exp-docker';
    const btnClass = tabType === 'compose' ? 'btn btn-compose' : 'btn btn-docker';
    const codeBlock = q.code ? `<div class="${codeClass}">${escHtml(q.code)}</div>` : '';
    const opts = q.options.map((o,oi) => `
      <div class="option" id="opt-${tabType}-${i}-${oi}" onclick="selectAnswer('${tabType}',${i},${oi})">
        <div class="option-key">${'ABCD'[oi]}</div>
        <div class="option-text">${o}</div>
      </div>`).join('');
    const total = qs.length;
    const isLast = i === total - 1;

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">Q ${i+1} of ${total}</span>
        <span class="q-tag ${tagClass}">${q.tag}</span>
      </div>
      <div class="question-text">${q.text}</div>
      ${codeBlock}
      <div class="options">${opts}</div>
      <div class="${expClass}" id="exp-${tabType}-${i}">
        <div class="ex-head">💡 Explanation</div>
        <span class="correct-label">✓ ${q.options[q.answer]}</span>
        <p>${q.explanation}</p>
        ${q.code ? `<div class="ex-code">${escHtml(q.code)}</div>` : ''}
      </div>
      <div class="nav-btns" id="nav-${tabType}-${i}" style="display:none">
        ${isLast
          ? `<button class="${btnClass}" onclick="showSectionResult('${tabType}')">View Results 🎯</button>`
          : `<button class="${btnClass}" onclick="nextQ('${tabType}',${i})">Next Question →</button>`}
      </div>`;
    section.appendChild(card);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════════
//  INTERACTION
// ════════════════════════════════════════════════════════════
function selectAnswer(tab, qi, oi) {
  const q = (tab === 'docker' ? dockerQuestions : composeQuestions)[qi];
  const opts = document.querySelectorAll(`[id^="opt-${tab}-${qi}-"]`);
  opts.forEach(o => { o.classList.add('disabled'); o.onclick = null; });
  if (oi === q.answer) { opts[oi].classList.add('correct'); state[tab].score++; }
  else { opts[oi].classList.add('wrong'); opts[q.answer].classList.add('correct'); }
  state[tab].answered++;
  document.getElementById(`exp-${tab}-${qi}`).classList.add('show');
  document.getElementById(`nav-${tab}-${qi}`).style.display = 'flex';
  updateProgress();
}

function nextQ(tab, cur) {
  document.getElementById(`q-${tab}-${cur}`).classList.remove('active');
  const next = cur + 1;
  const qs = tab === 'docker' ? dockerQuestions : composeQuestions;
  if (next < qs.length) {
    const cat = document.getElementById(`cat-${tab}-${next}`);
    if (cat) cat.style.display = 'flex';
    document.getElementById(`q-${tab}-${next}`).classList.add('active');
    document.getElementById(`q-${tab}-${next}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('section-docker').classList.toggle('active', tab === 'docker');
  document.getElementById('section-compose').classList.toggle('active', tab === 'compose');
  document.getElementById('tab-docker').className = 'tab-btn' + (tab === 'docker' ? ' active-docker' : '');
  document.getElementById('tab-compose').className = 'tab-btn' + (tab === 'compose' ? ' active-compose' : '');
  updateProgress();
}

function updateProgress() {
  const tab = activeTab;
  const qs = tab === 'docker' ? dockerQuestions : composeQuestions;
  const s = state[tab];
  const pct = Math.round((s.answered / qs.length) * 100);
  const fill = document.getElementById('progress-fill');
  fill.style.width = pct + '%';
  fill.className = `progress-bar-fill fill-${tab}`;
  document.getElementById('progress-label').textContent = `${s.answered} / ${qs.length}`;
  const badge = document.getElementById('score-badge');
  badge.textContent = `Score: ${s.score}`;
  badge.className = `score-badge badge-${tab}`;
}

function showSectionResult(tab) {
  const qs = tab === 'docker' ? dockerQuestions : composeQuestions;
  const s = state[tab];
  const pct = Math.round((s.score / qs.length) * 100);
  const label = tab === 'docker' ? 'Docker Core' : 'Docker Compose';
  const scoreEl = document.getElementById(`br-${tab}-score`);
  const titleEl = document.getElementById(`br-${tab}-title`);
  const subEl   = document.getElementById(`br-${tab}-sub`);
  scoreEl.textContent = `${s.score}/${qs.length}`;
  let title, sub;
  if (pct >= 90)      { title='Excellent'; sub='Production-ready skills!'; }
  else if (pct >= 75) { title='Great Job'; sub='Solid foundation — review edge cases.'; }
  else if (pct >= 55) { title='Good Start'; sub='Keep practising the scenarios.'; }
  else                { title='Keep Going'; sub='Review explanations and retry.'; }
  titleEl.textContent = title;
  subEl.textContent = sub;

  const bothDone = state.docker.answered === dockerQuestions.length && state.compose.answered === composeQuestions.length;
  if (bothDone) {
    document.getElementById('both-results').classList.add('show');
    document.getElementById('both-results').scrollIntoView({ behavior: 'smooth' });
  } else {
    // Prompt to switch tab
    const otherTab = tab === 'docker' ? 'compose' : 'docker';
    const otherName = tab === 'docker' ? 'Docker Compose' : 'Docker Core';
    if (confirm(`${label} quiz complete! 🎉\n\nSwitch to the ${otherName} quiz now?`)) {
      switchTab(otherTab);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      document.getElementById('both-results').classList.add('show');
      document.getElementById('both-results').scrollIntoView({ behavior: 'smooth' });
    }
  }
}

function restartAll() {
  ['docker','compose'].forEach(t => { state[t] = { answered:0, score:0, current:0 }; });
  document.getElementById('both-results').classList.remove('show');
  buildSection(dockerQuestions, 'section-docker', 'docker');
  buildSection(composeQuestions, 'section-compose', 'compose');
  switchTab('docker');
  window.scrollTo({ top:0, behavior:'smooth' });
}

function restartSection(tab) {
  state[tab] = { answered:0, score:0, current:0 };
  document.getElementById('both-results').classList.remove('show');
  document.getElementById(`br-${tab}-score`).textContent = '—';
  document.getElementById(`br-${tab}-title`).textContent = '';
  document.getElementById(`br-${tab}-sub`).textContent = '';
  if (tab === 'docker') buildSection(dockerQuestions, 'section-docker', 'docker');
  else buildSection(composeQuestions, 'section-compose', 'compose');
  switchTab(tab);
  updateProgress();
  window.scrollTo({ top:0, behavior:'smooth' });
}

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
buildSection(dockerQuestions, 'section-docker', 'docker');
buildSection(composeQuestions, 'section-compose', 'compose');
updateProgress();
</script>
</body>
</html>
