<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lsof Interview MCQ Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f0;
    --surface: #fafffe;
    --surface2: #f2faf5;
    --border: #c8ddd0;
    --accent: #1a7a4a;
    --accent2: #0d5c38;
    --accent3: #1b3a2d;
    --text: #141c18;
    --text-muted: #4a6357;
    --correct: #1a7a4a;
    --correct-bg: #edf7f2;
    --wrong: #b83020;
    --wrong-bg: #fdf0ee;
    --option-hover: #e6f5ec;
    --tag-bg: #d6e8dc;
    --shadow: 0 4px 24px rgba(10,50,30,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Lora', Georgia, serif;
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--accent3);
    color: #fff;
    padding: 48px 40px 36px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: 'lsof';
    font-family: 'Syne', sans-serif;
    font-size: 180px;
    font-weight: 800;
    color: rgba(255,255,255,0.05);
    position: absolute;
    right: -10px;
    top: -30px;
    line-height: 1;
    letter-spacing: -6px;
    pointer-events: none;
    user-select: none;
  }
  header .label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 12px;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(26px, 5vw, 50px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
  }
  header h1 span { color: #6ddba0; }
  header p {
    margin-top: 14px;
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    font-style: italic;
    max-width: 520px;
  }

  .progress-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(10,50,30,0.07);
  }
  .progress-bar-bg {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), var(--accent));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }
  .progress-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 80px;
    text-align: right;
  }
  .score-badge {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    background: var(--accent3);
    color: #fff;
    padding: 4px 14px;
    border-radius: 99px;
    white-space: nowrap;
  }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  .question-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 36px 36px 28px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
    animation: cardIn 0.4s ease both;
    display: none;
  }
  .question-card.active { display: block; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .q-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .q-tag {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 99px;
    background: var(--tag-bg);
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .q-tag.advanced { background: #ede8ff; color: #5b3fa0; }
  .q-tag.scenario { background: #fff4e0; color: #8a5a00; }
  .q-tag.practical { background: #e0eeff; color: #1a4a8c; }

  .question-text {
    font-size: 18px;
    line-height: 1.65;
    margin-bottom: 8px;
    color: var(--text);
  }

  .q-code {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    background: #0f1f17;
    color: #6ddba0;
    padding: 14px 18px;
    border-radius: 8px;
    margin: 14px 0 4px;
    border-left: 3px solid var(--accent);
    overflow-x: auto;
    white-space: pre;
    line-height: 1.7;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 22px;
  }
  .option {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--surface2);
    transition: all 0.18s ease;
    user-select: none;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: var(--option-hover);
    transform: translateX(3px);
  }
  .option-key {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    min-width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--border);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .option-text {
    font-size: 15px;
    line-height: 1.55;
    padding-top: 2px;
  }
  .option-code {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.07);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct .option-key { background: var(--correct); color: #fff; }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.wrong .option-key { background: var(--wrong); color: #fff; }
  .option.disabled { cursor: default; }

  .explanation {
    display: none;
    margin-top: 20px;
    padding: 18px 20px;
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    background: #e8f7ef;
    animation: fadeIn 0.3s ease;
  }
  .explanation.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .explanation .ex-head {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .explanation p { font-size: 14px; line-height: 1.7; color: #1a3a28; }
  .explanation .ex-code {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: #0f1f17;
    color: #6ddba0;
    padding: 10px 14px;
    border-radius: 6px;
    margin-top: 10px;
    overflow-x: auto;
    white-space: pre;
    line-height: 1.65;
  }
  .explanation .correct-label {
    display: inline-block;
    background: var(--correct);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .nav-btns {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    justify-content: flex-end;
  }
  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.18s;
  }
  .btn-primary { background: var(--accent3); color: #fff; }
  .btn-primary:hover { background: #0e2318; transform: translateY(-1px); }
  .btn-secondary { background: transparent; color: var(--accent3); border: 1.5px solid var(--accent3); }
  .btn-secondary:hover { background: #e8f7ef; }

  #result-screen {
    display: none;
    text-align: center;
    padding: 60px 20px;
    animation: cardIn 0.5s ease both;
  }
  .result-icon { font-size: 64px; margin-bottom: 16px; }
  .result-score-big {
    font-family: 'Syne', sans-serif;
    font-size: 80px;
    font-weight: 800;
    color: var(--accent3);
    line-height: 1;
  }
  .result-score-big span { color: var(--accent); }
  .result-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; margin: 16px 0 8px; }
  .result-subtitle { font-size: 16px; color: var(--text-muted); font-style: italic; margin-bottom: 36px; }
  .result-stats { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
  .stat-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px 28px;
    min-width: 140px;
  }
  .stat-num { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; color: var(--accent3); }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-top: 4px; }

  .category-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 40px 0 24px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .category-divider::before, .category-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  @media (max-width: 600px) {
    header { padding: 36px 20px 28px; }
    .progress-wrap { padding: 14px 16px; }
    main { padding: 28px 12px 60px; }
    .question-card { padding: 24px 18px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="label">Linux / DevOps / SRE Interview Prep</div>
  <h1>lsof — List Open Files<br><span>MCQ Quiz</span></h1>
  <p>30 multiple choice questions · Basic to Advanced · With real-world examples</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>
  <div class="progress-label" id="progress-label">0 / 30</div>
  <div class="score-badge" id="score-badge">Score: 0</div>
</div>

<main id="quiz-main"></main>

<div id="result-screen">
  <div class="result-icon" id="result-emoji">🎉</div>
  <div class="result-score-big" id="result-score-big"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-subtitle" id="result-subtitle"></div>
  <div class="result-stats">
    <div class="stat-box">
      <div class="stat-num" id="stat-correct" style="color:var(--correct)"></div>
      <div class="stat-label">Correct</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-wrong" style="color:var(--wrong)"></div>
      <div class="stat-label">Wrong</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-pct"></div>
      <div class="stat-label">Accuracy</div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="restartQuiz()">Restart Quiz</button>
</div>

<script>
const questions = [

  // ── BASICS ─────────────────────────────────────────────────
  {
    category: "Basics",
    tag: "basic",
    text: "What does <code class='option-code'>lsof</code> stand for?",
    options: ["List System Open Files","LiSt Open Files","Linux Socket Open Filesystem","List of Socket Operations Files"],
    answer: 1,
    explanation: "<strong>lsof</strong> stands for <strong>LiSt Open Files</strong>. Because Linux treats almost everything as a file — regular files, sockets, pipes, devices, and network connections — lsof is one of the most powerful diagnostic tools available.",
    code: null
  },
  {
    category: "Basics",
    tag: "basic",
    text: "Which of the following is NOT shown in lsof output by default?",
    options: ["Process ID (PID)","Username","File path","CPU usage"],
    answer: 3,
    explanation: "<strong>lsof</strong> shows PID, user, file descriptor, file type, file path/address — but <strong>not CPU usage</strong>. For CPU stats use <code>top</code>, <code>htop</code>, or <code>ps</code>.",
    code: "# Default lsof columns:\n# COMMAND  PID   USER   FD   TYPE  DEVICE  SIZE  NODE  NAME\n# nginx   1234   root  cwd   DIR    8,1    4096   128  /\n# nginx   1234   root    4u  IPv4  56789    0t0   TCP  *:80 (LISTEN)"
  },
  {
    category: "Basics",
    tag: "basic",
    text: "Which command finds all open files on the entire system?",
    options: ["lsof -a","lsof","lsof -all","lsof /"],
    answer: 1,
    explanation: "Running <strong>lsof</strong> without arguments lists ALL open files across all processes on the system. It can produce thousands of lines — pipe through <code>less</code> or use filters.",
    code: "lsof | less\n# or count total open files:\nlsof | wc -l"
  },
  {
    category: "Basics",
    tag: "basic",
    text: "What does the file descriptor <code class='option-code'>cwd</code> mean in lsof output?",
    options: ["Closed write descriptor","Current working directory","Character write device","Connection write data"],
    answer: 1,
    explanation: "<strong>cwd</strong> stands for <em>Current Working Directory</em> — the directory the process was started from or has changed to. Other common FD values: <code>txt</code> (program text), <code>mem</code> (memory-mapped), <code>0u</code> stdin, <code>1u</code> stdout, <code>2u</code> stderr.",
    code: "# Common file descriptors in lsof:\n# cwd → current working directory\n# txt → program text (code/data)\n# mem → memory-mapped file\n# 0u  → stdin\n# 1u  → stdout\n# 2u  → stderr\n# 3u  → first file opened by program"
  },
  {
    category: "Basics",
    tag: "basic",
    text: "Which command checks what process is using a specific file?",
    options: ["lsof -f /var/log/syslog","lsof /var/log/syslog","fuser -f /var/log/syslog","ls -lh /var/log/syslog"],
    answer: 1,
    explanation: "Passing a <strong>file path directly</strong> to lsof shows all processes that have that file open. This is extremely useful when a file is locked or you need to identify who is writing to a log.",
    code: "lsof /var/log/syslog\n\n# Output example:\n# COMMAND  PID   USER  FD  TYPE DEVICE SIZE NODE NAME\n# rsyslogd 887   root   7w  REG  253,0  48K  1234 /var/log/syslog"
  },

  // ── NETWORK ────────────────────────────────────────────────
  {
    category: "Network & Ports",
    tag: "basic",
    text: "How do you find which process is listening on port 8080?",
    options: ["lsof -port 8080","lsof -i :8080","lsof --port=8080","netstat lsof 8080"],
    answer: 1,
    explanation: "<strong>lsof -i :8080</strong> uses the <code>-i</code> (internet) flag with a colon-prefixed port number. This is the go-to command when you get a 'port already in use' error.",
    code: "lsof -i :8080\n\n# Example output:\n# COMMAND  PID   USER  FD  TYPE  DEVICE  SIZE  NODE  NAME\n# java    1234   root  45u IPv4   12345   0t0   TCP  *:8080 (LISTEN)\n\n# Kill that process:\nkill -9 $(lsof -t -i :8080)"
  },
  {
    category: "Network & Ports",
    tag: "basic",
    text: "Which command lists ALL listening ports without DNS resolution?",
    options: ["lsof -i -P -n | grep LISTEN","lsof --listen --no-dns","lsof -l | grep LISTEN","lsof -ports"],
    answer: 0,
    explanation: "<code>-i</code> selects network files, <code>-P</code> shows raw port numbers (not service names), and <code>-n</code> skips DNS resolution for speed. The <code>grep LISTEN</code> filters only listening sockets.",
    code: "lsof -i -P -n | grep LISTEN\n\n# Example output:\n# sshd    987  root  3u  IPv4  12000  0t0  TCP *:22 (LISTEN)\n# nginx  1234  root  6u  IPv4  13000  0t0  TCP *:80 (LISTEN)\n# mysqld 2345  mysql 22u IPv4  14000  0t0  TCP *:3306 (LISTEN)"
  },
  {
    category: "Network & Ports",
    tag: "basic",
    text: "How do you check only TCP connections using lsof?",
    options: ["lsof -protocol tcp","lsof -i TCP","lsof --tcp","lsof -t TCP"],
    answer: 1,
    explanation: "<strong>lsof -i TCP</strong> filters output to show only TCP-based connections and listening sockets. Use <code>lsof -i UDP</code> for UDP.",
    code: "# TCP only\nlsof -i TCP\n\n# UDP only\nlsof -i UDP\n\n# TCP on specific port\nlsof -i TCP:443\n\n# Established TCP connections only\nlsof -i TCP -s TCP:ESTABLISHED"
  },
  {
    category: "Network & Ports",
    tag: "practical",
    text: "How do you find processes connected TO a specific remote IP address?",
    options: ["lsof -remote 192.168.1.10","lsof -i @192.168.1.10","lsof --ip=192.168.1.10","lsof -i 192.168.1.10"],
    answer: 1,
    explanation: "The <strong>@</strong> prefix in lsof's -i argument specifies a remote hostname or IP. This is useful for identifying which processes are communicating with a specific server.",
    code: "# All connections to/from a remote IP\nlsof -i @192.168.1.10\n\n# Combine with TCP and port:\nlsof -i TCP@192.168.1.10:5432\n\n# All established connections to that IP:\nlsof -i @192.168.1.10 -s TCP:ESTABLISHED"
  },
  {
    category: "Network & Ports",
    tag: "practical",
    text: "Which one-liner instantly kills the process occupying port 3000?",
    options: [
      "lsof -kill -i :3000",
      "kill -9 $(lsof -t -i :3000)",
      "lsof -i :3000 | kill",
      "pkill lsof :3000"
    ],
    answer: 1,
    explanation: "<code>lsof -t</code> outputs only the PID (terse mode), which can be passed directly to <code>kill -9</code> via command substitution. Clean and scriptable.",
    code: "# Kill process on port 3000\nkill -9 $(lsof -t -i :3000)\n\n# Safer version — confirm PID first:\nlsof -t -i :3000          # see the PID\nkill -9 &lt;PID&gt;             # then kill it\n\n# Also works with fuser:\nfuser -k 3000/tcp"
  },

  // ── PROCESS & USER ─────────────────────────────────────────
  {
    category: "Process & User Filters",
    tag: "basic",
    text: "How do you list all open files for a specific process ID (e.g., PID 4567)?",
    options: ["lsof --pid=4567","lsof -p 4567","lsof -P 4567","lsof /proc/4567"],
    answer: 1,
    explanation: "<strong>lsof -p &lt;PID&gt;</strong> lists all files, sockets, and descriptors held open by that process. Essential for debugging a misbehaving process.",
    code: "lsof -p 4567\n\n# Count open file descriptors for a process:\nlsof -p 4567 | wc -l\n\n# Multiple PIDs:\nlsof -p 1234,5678\n\n# Exclude a PID:\nlsof -p ^1234"
  },
  {
    category: "Process & User Filters",
    tag: "basic",
    text: "How do you see files opened by the user <code class='option-code'>www-data</code>?",
    options: ["lsof --user www-data","lsof -u www-data","lsof -U www-data","lsof user=www-data"],
    answer: 1,
    explanation: "<strong>lsof -u &lt;username&gt;</strong> filters results to show files opened by a specific user. You can also use a UID number.",
    code: "# By username\nlsof -u www-data\n\n# By UID\nlsof -u 33\n\n# Multiple users\nlsof -u nginx,apache\n\n# Exclude a user (^ = NOT)\nlsof -u ^root"
  },
  {
    category: "Process & User Filters",
    tag: "basic",
    text: "What does the <code class='option-code'>^</code> symbol mean in <code class='option-code'>lsof -u ^root</code>?",
    options: ["Show only root's files","Show files older than root","Exclude root (NOT operator)","Show root's home directory"],
    answer: 2,
    explanation: "In lsof, <strong>^</strong> is a negation/NOT operator. <code>lsof -u ^root</code> shows files opened by all users <em>except</em> root. This works for other filters too.",
    code: "# Exclude root user\nlsof -u ^root\n\n# Exclude a specific PID\nlsof -p ^1\n\n# Combine: files by www-data excluding PID 999\nlsof -u www-data -p ^999"
  },
  {
    category: "Process & User Filters",
    tag: "basic",
    text: "How do you list all open files for a command named <code class='option-code'>nginx</code>?",
    options: ["lsof -name nginx","lsof -c nginx","lsof --cmd nginx","lsof /usr/sbin/nginx"],
    answer: 1,
    explanation: "<strong>lsof -c &lt;command&gt;</strong> matches processes whose command name begins with the given string. Great for investigating a specific application.",
    code: "# All files opened by nginx processes\nlsof -c nginx\n\n# Case-insensitive match (regex)\nlsof -c /nginx/i\n\n# Combine with network filter:\nlsof -c nginx -i TCP"
  },

  // ── DISK & FILES ───────────────────────────────────────────
  {
    category: "Disk & File Investigation",
    tag: "practical",
    text: "Your disk is 100% full, but <code class='option-code'>du</code> and <code class='option-code'>ls</code> show no large files. What lsof command reveals the culprit?",
    options: ["lsof -disk","lsof | grep deleted","lsof +D /","lsof -space"],
    answer: 1,
    explanation: "In Linux, deleting a file only removes its directory entry. If a process still has the file open, the <strong>inode and disk blocks are not freed</strong> until the process closes or is killed. <code>lsof | grep deleted</code> reveals these 'ghost' files.",

let score = 0;
let answered = 0;

function buildQuiz() {
  const main = document.getElementById('quiz-main');
  main.innerHTML = '';
  let lastCat = '';

  questions.forEach((q, i) => {
    if (q.category !== lastCat) {
      const div = document.createElement('div');
      div.className = 'category-divider';
      div.id = `cat-${i}`;
      div.textContent = q.category;
      div.style.display = i === 0 ? 'flex' : 'none';
      main.appendChild(div);
      lastCat = q.category;
    }

    const card = document.createElement('div');
    card.className = 'question-card' + (i === 0 ? ' active' : '');
    card.id = `q-${i}`;

    const tagClass = q.tag === 'advanced' ? 'advanced' : q.tag === 'scenario' ? 'scenario' : q.tag === 'practical' ? 'practical' : '';

    const codeBlock = q.code ? `<div class="q-code">${escHtml(q.code)}</div>` : '';

    const opts = q.options.map((o, oi) => `
      <div class="option" id="opt-${i}-${oi}" onclick="selectAnswer(${i},${oi})">
        <div class="option-key">${'ABCD'[oi]}</div>
        <div class="option-text">${o}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">Q ${i+1} of ${questions.length}</span>
        <span class="q-tag ${tagClass}">${q.tag}</span>
      </div>
      <div class="question-text">${q.text}</div>
      ${codeBlock}
      <div class="options">${opts}</div>
      <div class="explanation" id="exp-${i}">
        <div class="ex-head">💡 Explanation</div>
        <span class="correct-label">Correct: ${q.options[q.answer]}</span>
        <p>${q.explanation}</p>
        ${q.code ? `<div class="ex-code">${escHtml(q.code)}</div>` : ''}
      </div>
      <div class="nav-btns" id="nav-${i}" style="display:none">
        ${i < questions.length - 1
          ? `<button class="btn btn-primary" onclick="nextQ(${i})">Next Question →</button>`
          : `<button class="btn btn-primary" onclick="showResult()">View Results 🎯</button>`}
      </div>`;
    main.appendChild(card);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selectAnswer(qi, oi) {
  const q = questions[qi];
  const opts = document.querySelectorAll(`[id^="opt-${qi}-"]`);
  opts.forEach(o => { o.classList.add('disabled'); o.onclick = null; });
  if (oi === q.answer) { opts[oi].classList.add('correct'); score++; }
  else { opts[oi].classList.add('wrong'); opts[q.answer].classList.add('correct'); }
  answered++;
  document.getElementById(`exp-${qi}`).classList.add('show');
  document.getElementById(`nav-${qi}`).style.display = 'flex';
  updateProgress();
}

function nextQ(cur) {
  document.getElementById(`q-${cur}`).classList.remove('active');
  const next = cur + 1;
  if (next < questions.length) {
    const cat = document.getElementById(`cat-${next}`);
    if (cat) cat.style.display = 'flex';
    document.getElementById(`q-${next}`).classList.add('active');
    document.getElementById(`q-${next}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${answered} / ${questions.length}`;
  document.getElementById('score-badge').textContent = `Score: ${score}`;
}

function showResult() {
  document.getElementById('quiz-main').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('result-score-big').innerHTML = `${score}<span>/${questions.length}</span>`;
  document.getElementById('stat-correct').textContent = score;
  document.getElementById('stat-wrong').textContent = questions.length - score;
  document.getElementById('stat-pct').textContent = pct + '%';

  let emoji, title, subtitle;
  if (pct >= 90)      { emoji='🏆'; title='Outstanding!'; subtitle='You know lsof inside out. Senior SRE level.'; }
  else if (pct >= 75) { emoji='🎯'; title='Great Work!'; subtitle='Solid understanding — review the trickier flags.'; }
  else if (pct >= 55) { emoji='📚'; title='Good Progress!'; subtitle='Keep practicing the scenario-based questions.'; }
  else                { emoji='💪'; title='Keep Going!'; subtitle='Read the explanations and try again!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = subtitle;
  rs.scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
  score = 0; answered = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-main').style.display = 'block';
  updateProgress();
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateProgress();
</script>
