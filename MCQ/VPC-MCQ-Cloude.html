<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS VPC Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
	--bg: #eaf4ff;          /* light blue background */
	--card: #ffffff;       /* clean white cards */
	--border: #cfe3ff;     /* soft blue border */
	--accent: #3b82f6;     /* primary blue */
	--accent2: #60a5fa;    /* secondary blue */
	--correct: #10b981;    /* green (kept clean) */
	--wrong: #ef4444;      /* red (kept clean) */
	--text: #0f172a;       /* dark text for readability */
	--muted: #64748b;      /* soft gray-blue */
    --highlight: rgba(168,255,120,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; background-image: radial-gradient(ellipse at 15% 10%, rgba(251,146,60,0.07) 0%, transparent 50%), radial-gradient(ellipse at 85% 90%, rgba(234,88,12,0.06) 0%, transparent 50%); }
  header { text-align: center; margin-bottom: 36px; }
  .badge { display: inline-block; background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.3); color: var(--accent); font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 3px; padding: 6px 16px; border-radius: 2px; margin-bottom: 16px; text-transform: uppercase; }
  h1 { font-size: clamp(28px, 5vw, 48px); font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); margin-top: 8px; font-size: 14px; font-family: 'Space Mono', monospace; }
  .quiz-container { width: 100%; max-width: 780px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .legend-item { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; padding: 4px 10px; border-radius: 3px; text-transform: uppercase; }
  .progress-bar-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }
  .progress-text { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 36px 40px; position: relative; overflow: hidden; animation: slideIn 0.35s ease; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  @keyframes slideIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .q-number { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .q-tag { font-size: 9px; letter-spacing: 1.5px; padding: 2px 8px; border-radius: 2px; text-transform: uppercase; font-weight: 700; }
  .tag-core     { background: rgba(251,146,60,0.12);  border: 1px solid rgba(251,146,60,0.3);  color: #fb923c; }
  .tag-subnet   { background: rgba(56,189,248,0.12);  border: 1px solid rgba(56,189,248,0.3);  color: #38bdf8; }
  .tag-security { background: rgba(251,191,36,0.12);  border: 1px solid rgba(251,191,36,0.3);  color: #fbbf24; }
  .tag-routing  { background: rgba(52,211,153,0.12);  border: 1px solid rgba(52,211,153,0.3);  color: #34d399; }
  .tag-peering  { background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.3); color: #a78bfa; }
  .tag-monitor  { background: rgba(244,114,182,0.12); border: 1px solid rgba(244,114,182,0.3); color: #f472b6; }
  .tag-scenario { background: rgba(255,77,109,0.12);  border: 1px solid rgba(255,77,109,0.3);  color: #ff4d6d; }
  .question { font-size: 21px; font-weight: 600; line-height: 1.4; margin-bottom: 28px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; cursor: pointer; display: flex; align-items: flex-start; gap: 14px; transition: all 0.2s ease; font-size: 15px; line-height: 1.5; }
  .option:hover:not(.locked) { border-color: rgba(251,146,60,0.4); background: var(--highlight); transform: translateX(4px); }
  .option-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; margin-top: 2px; transition: all 0.2s ease; }
  .option.correct { border-color: var(--correct); background: rgba(0,229,160,0.06); }
  .option.correct .option-dot { border-color: var(--correct); background: var(--correct); }
  .option.wrong   { border-color: var(--wrong); background: rgba(255,77,109,0.06); }
  .option.wrong .option-dot { border-color: var(--wrong); background: var(--wrong); }
  .option-label { flex: 1; }
  .option-tag { font-family: 'Space Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 2px; margin-left: auto; flex-shrink: 0; align-self: center; font-weight: 700; letter-spacing: 1px; }
  .tag-correct { background: rgba(0,229,160,0.15); color: var(--correct); }
  .tag-wrong   { background: rgba(255,77,109,0.15); color: var(--wrong); }
  .explanation-box { margin-top: 20px; padding: 16px 20px; background: rgba(251,146,60,0.04); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .explanation-title { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
  .explanation-text { font-size: 14px; color: #94a3b8; line-height: 1.6; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px; }
  .btn { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; padding: 12px 28px; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
  .btn-back { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-back:hover { border-color: rgba(251,146,60,0.4); color: var(--text); }
  .btn-back:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-next { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 4px 20px rgba(251,146,60,0.2); }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(251,146,60,0.35); }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-reset { background: rgba(234,88,12,0.08); border: 1px solid rgba(234,88,12,0.25); color: var(--accent2); padding: 10px 20px; font-size: 13px; }
  .btn-reset:hover { background: rgba(234,88,12,0.18); }
  .dots-nav { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all 0.2s ease; border: 1px solid transparent; }
  .dot.active   { background: var(--accent); transform: scale(1.35); }
  .dot.answered { background: rgba(0,229,160,0.5); }
  .dot.current  { border-color: var(--accent); }
  .result-screen { text-align: center; padding: 50px 40px; }
  .result-score { font-size: 80px; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .result-label { font-family: 'Space Mono', monospace; color: var(--muted); font-size: 13px; letter-spacing: 2px; margin-top: 8px; }
  .result-msg { font-size: 20px; font-weight: 600; margin-top: 24px; margin-bottom: 32px; }
  .result-list { display: flex; gap: 8px; flex-direction: column; margin-bottom: 32px; text-align: left; max-width: 440px; margin-left: auto; margin-right: auto; }
  .result-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  @media (max-width: 560px) { .card { padding: 24px 20px; } .question { font-size: 17px; } .nav-row { flex-wrap: wrap; } .btn-reset { order: -1; width: 100%; justify-content: center; } }
</style>
</head>
<body>

<header>
  <div class="badge">AWS Certification Prep</div>
  <h1>Virtual Private <span>Cloud</span></h1>
  <p class="subtitle">// 10 questions · VPC Fundamentals</p>
</header>

<div class="quiz-container">
  <div class="legend">
    <span class="legend-item tag-core">Core</span>
    <span class="legend-item tag-subnet">Subnets</span>
    <span class="legend-item tag-routing">Routing</span>
    <span class="legend-item tag-security">Security</span>
    <span class="legend-item tag-peering">Peering</span>
    <span class="legend-item tag-monitor">Monitoring</span>
    <span class="legend-item tag-scenario">Scenario</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>
  </div>
  <div id="quizArea"></div>
  <div class="dots-nav" id="dotsNav"></div>
</div>

<script>
const questions = [
  {
    q: "What is an AWS VPC (Virtual Private Cloud)?",
    tag: "core",
    options: [
      "A physical data center rented from AWS where you install your own hardware",
      "A managed Kubernetes cluster that isolates containerized workloads from the internet",
      "A logically isolated network in AWS where you define your own IP range, subnets, route tables, and security controls to launch resources like EC2 and RDS",
      "A VPN tunnel between your on-premises network and an AWS region"
    ],
    correct: 2,
    explanation: "A VPC is your own private, logically isolated section of the AWS cloud. Think of it as a virtual data center — you control the network topology: IP address ranges (CIDR blocks), subnet layout, route tables, internet access, and security rules. Multiple VPCs can exist in one account, and each AWS region gets a default VPC automatically."
  },
  {
    q: "What are subnets in a VPC and why are they important?",
    tag: "subnet",
    options: [
      "Subnets are billing groups that split VPC costs across teams or projects",
      "Subnets are smaller IP segments carved from the VPC CIDR block that organize resources and enable security separation (e.g., public web tier vs private database tier)",
      "Subnets are read-only snapshots of VPC configuration used for disaster recovery",
      "Subnets are virtual switches that connect multiple VPCs within the same region"
    ],
    correct: 1,
    explanation: "Subnets divide the VPC's IP space into smaller routable blocks. Each subnet lives in one Availability Zone. The critical design pattern: place internet-facing resources (web servers, load balancers) in public subnets, and sensitive resources (databases, internal APIs) in private subnets. This is the foundation of a secure multi-tier architecture."
  },
  {
    q: "What is the difference between a public subnet and a private subnet?",
    tag: "subnet",
    options: [
      "Public subnets allow all traffic; private subnets only allow TCP traffic",
      "Public subnets use IPv6 addressing; private subnets use IPv4 only",
      "A public subnet has a route to an Internet Gateway enabling direct internet access; a private subnet has no direct route to the internet",
      "Public subnets are multi-AZ; private subnets are restricted to a single AZ"
    ],
    correct: 2,
    explanation: "The distinction is purely routing: if a subnet's route table has a 0.0.0.0/0 route pointing to an Internet Gateway (IGW), it's public — instances with public IPs can send and receive internet traffic. Without that IGW route, the subnet is private. This separation ensures databases and app servers are never directly reachable from the internet — the #1 VPC security best practice."
  },
  {
    q: "What is an Internet Gateway (IGW) in AWS?",
    tag: "routing",
    options: [
      "A paid service that accelerates internet downloads by caching content at AWS edge locations",
      "A horizontally scaled, redundant VPC component that enables bidirectional communication between VPC instances and the internet",
      "A firewall appliance that inspects all inbound internet traffic before it reaches your EC2 instances",
      "A NAT device that translates private IP addresses to a shared public IP for outbound traffic only"
    ],
    correct: 1,
    explanation: "The Internet Gateway serves two purposes: (1) provides a target in route tables for internet-bound traffic, and (2) performs network address translation (NAT) for instances with public IPv4 addresses. Without an IGW attached to the VPC AND a route table entry pointing to it, no instance — even one with a public IP — can reach or be reached from the internet."
  },
  {
    q: "What is a NAT Gateway and why is it needed?",
    tag: "routing",
    options: [
      "A NAT Gateway assigns permanent static public IPs to all instances in a VPC",
      "A NAT Gateway allows instances in private subnets to initiate outbound internet connections while blocking unsolicited inbound connections from the internet",
      "A NAT Gateway is required for VPC peering to function between two VPCs",
      "A NAT Gateway replaces the Internet Gateway and handles all internet traffic for the entire VPC"
    ],
    correct: 1,
    explanation: "Private subnet instances have no public IP and no route to the internet — but they often need outbound access (OS updates, calling third-party APIs, pulling Docker images). A NAT Gateway sits in a public subnet, translates the private instance's IP for outbound traffic, and drops any unsolicited inbound requests. The private subnet's route table points 0.0.0.0/0 to the NAT Gateway, not the IGW."
  },
  {
    q: "What is a VPC Route Table?",
    tag: "routing",
    options: [
      "A log of all API calls made to VPC resources, stored in CloudTrail",
      "A DNS resolution table that maps hostnames to private IP addresses within the VPC",
      "A set of rules that determine where network traffic from a subnet is directed based on the destination IP address",
      "A billing dashboard that shows network traffic costs broken down by subnet"
    ],
    correct: 2,
    explanation: "Every subnet is associated with a route table. Routes are evaluated by most-specific CIDR match. Key routes: 10.0.0.0/16 local (VPC-internal, always present), 0.0.0.0/0 to igw-xxx (public subnet to internet), 0.0.0.0/0 to nat-xxx (private subnet outbound via NAT). The main route table applies to subnets with no explicit association. Misconfigured route tables are the most common VPC networking issue."
  },
  {
    q: "What is the difference between a Security Group and a Network ACL (NACL)?",
    tag: "security",
    options: [
      "Security Groups are for EC2 only; NACLs are for RDS databases only",
      "Security Groups are stateful firewalls at the instance/ENI level; NACLs are stateless firewalls at the subnet level requiring explicit allow rules for both inbound AND return traffic",
      "Security Groups only support IPv4; NACLs support both IPv4 and IPv6",
      "NACLs are paid features; Security Groups are free for all EC2 instances"
    ],
    correct: 1,
    explanation: "Key differences: Security Groups are stateful (return traffic automatically allowed), support only ALLOW rules, applied per instance, and all rules are checked. NACLs are stateless (you must explicitly allow return traffic on ephemeral ports), support both ALLOW and DENY rules, applied per subnet, and rules are evaluated in number order (lowest first, first match wins). Use NACLs for broad subnet-level rules and Security Groups for granular instance-level control."
  },
  {
    q: "What is VPC Peering?",
    tag: "peering",
    options: [
      "A feature that merges two VPCs into one, combining their CIDR blocks and resources",
      "A paid managed service that connects a VPC to an on-premises data center via dedicated fiber",
      "A networking connection between two VPCs that routes traffic privately using the AWS backbone — without internet, VPN, or gateway hardware",
      "A feature that replicates EC2 instances from one VPC to another for disaster recovery"
    ],
    correct: 2,
    explanation: "VPC peering creates a private network route between two VPCs (same account, different accounts, or different regions). Traffic stays on the AWS network — never the public internet. Common use cases: microservices in separate VPCs communicating securely, sharing a central logging or monitoring VPC, or connecting a vendor's VPC to yours. Important constraint: peering is non-transitive — if A peers with B and B peers with C, A cannot reach C through B."
  },
  {
    q: "Why can a private EC2 instance not access the internet by default?",
    tag: "scenario",
    options: [
      "Private EC2 instances are blocked by AWS Shield from making outbound connections",
      "Private instances have no Security Group outbound rules by default",
      "Private subnets have no route to an Internet Gateway or NAT Gateway, so outbound internet traffic has no path and is dropped",
      "EC2 instances in private subnets cannot be assigned an IAM role, which is required for internet access"
    ],
    correct: 2,
    explanation: "Networking in AWS follows the route table. A private subnet's route table has a local route for VPC-internal traffic but no 0.0.0.0/0 route pointing outward. When a private instance tries to reach an internet IP, there's no matching route — the packet is dropped. The fix: add a NAT Gateway in a public subnet, then add a route in the private subnet's table: 0.0.0.0/0 pointing to that NAT Gateway."
  },
  {
    q: "What are VPC Flow Logs and what are they used for?",
    tag: "monitor",
    options: [
      "Flow Logs are automated backups of route tables and security group configurations stored in S3",
      "Flow Logs capture metadata about IP traffic going to and from network interfaces in a VPC, stored in CloudWatch Logs or S3 for troubleshooting and security analysis",
      "Flow Logs are real-time packet captures that record full payload content for deep inspection",
      "Flow Logs are billing reports showing data transfer costs broken down by source and destination IP"
    ],
    correct: 1,
    explanation: "VPC Flow Logs record connection metadata: source/destination IP, ports, protocol, packet/byte counts, and whether traffic was ACCEPTED or REJECTED. They do NOT capture packet payloads. Critical uses: (1) Troubleshooting — REJECT entries pinpoint exactly which Security Group or NACL rule is blocking traffic. (2) Security monitoring — detect port scanning, unexpected lateral movement, or unusual data exfiltration. Stored in CloudWatch Logs or S3 for querying with Athena."
  }
];

let current = 0;
let answers = new Array(questions.length).fill(null);

const tagMeta = {
  core:     { label: 'Core',       cls: 'tag-core'     },
  subnet:   { label: 'Subnets',    cls: 'tag-subnet'   },
  routing:  { label: 'Routing',    cls: 'tag-routing'  },
  security: { label: 'Security',   cls: 'tag-security' },
  peering:  { label: 'Peering',    cls: 'tag-peering'  },
  monitor:  { label: 'Monitoring', cls: 'tag-monitor'  },
  scenario: { label: 'Scenario',   cls: 'tag-scenario' }
};

function render() {
  const q = questions[current];
  const ans = answers[current];
  const isAnswered = ans !== null;
  const total = questions.length;
  const tm = tagMeta[q.tag];

  document.getElementById('progressFill').style.width = ((current + 1) / total * 100) + '%';
  document.getElementById('progressText').textContent = (current + 1) + ' / ' + total;

  document.getElementById('dotsNav').innerHTML = questions.map(function(_, i) {
    var cls = 'dot';
    if (i === current) cls += ' active current';
    else if (answers[i] !== null) cls += ' answered';
    return '<div class="' + cls + '" onclick="goTo(' + i + ')"></div>';
  }).join('');

  var optionsHtml = q.options.map(function(opt, i) {
    var cls = 'option', tag = '';
    if (isAnswered) {
      cls += ' locked';
      if (i === q.correct) { cls += ' correct'; tag = '<span class="option-tag tag-correct">&#10003; CORRECT</span>'; }
      else if (i === ans)  { cls += ' wrong';   tag = '<span class="option-tag tag-wrong">&#10007; WRONG</span>'; }
    }
    return '<div class="' + cls + '" onclick="selectAnswer(' + i + ')"><div class="option-dot"></div><span class="option-label">' + opt + '</span>' + tag + '</div>';
  }).join('');

  var explanationHtml = isAnswered
    ? '<div class="explanation-box"><div class="explanation-title">&#9889; Explanation</div><div class="explanation-text">' + q.explanation + '</div></div>'
    : '';

  var isLast = current === total - 1;
  var allAnswered = answers.every(function(a) { return a !== null; });

  var nextBtn = (isLast && allAnswered)
    ? '<button class="btn btn-next" onclick="showResults()">See Results &#8594;</button>'
    : '<button class="btn btn-next" onclick="goNext()" ' + (!isAnswered ? 'disabled' : '') + '>Next &#8594;</button>';

  document.getElementById('quizArea').innerHTML =
    '<div class="card">' +
      '<div class="q-number">Question ' + (current+1) + ' of ' + total +
        ' <span class="q-tag ' + tm.cls + '">' + tm.label + '</span></div>' +
      '<div class="question">' + q.q + '</div>' +
      '<div class="options">' + optionsHtml + '</div>' +
      explanationHtml +
      '<div class="nav-row">' +
        '<button class="btn btn-back" onclick="goBack()" ' + (current === 0 ? 'disabled' : '') + '>&#8592; Back</button>' +
        '<button class="btn btn-reset" onclick="resetQuiz()">&#8635; Reset</button>' +
        nextBtn +
      '</div>' +
    '</div>';
}

function selectAnswer(i) { if (answers[current] !== null) return; answers[current] = i; render(); }
function goNext() { if (current < questions.length - 1) { current++; render(); } }
function goBack() { if (current > 0) { current--; render(); } }
function goTo(i)  { current = i; render(); }
function resetQuiz() { answers = new Array(questions.length).fill(null); current = 0; render(); }

function showResults() {
  var score = answers.filter(function(a, i) { return a === questions[i].correct; }).length;
  var pct = Math.round(score / questions.length * 100);
  var msg = pct === 100 ? '&#127942; Perfect! VPC master unlocked!'
          : pct >= 70  ? '&#127919; Strong networking knowledge!'
          :               '&#128218; Review explanations and retry!';

  document.getElementById('quizArea').innerHTML =
    '<div class="card result-screen">' +
      '<div class="result-score">' + score + '/' + questions.length + '</div>' +
      '<div class="result-label">FINAL SCORE &middot; ' + pct + '%</div>' +
      '<div class="result-msg">' + msg + '</div>' +
      '<div class="result-list">' +
        questions.map(function(q, i) {
          var icon = answers[i] === q.correct ? '&#9989;' : '&#10060;';
          var label = q.q.length > 46 ? q.q.slice(0,46)+'&hellip;' : q.q;
          return '<div class="result-item"><span style="font-size:15px">' + icon + '</span>' +
            '<span class="q-tag ' + tagMeta[q.tag].cls + '" style="font-size:9px">' + tagMeta[q.tag].label + '</span>' +
            'Q' + (i+1) + ': ' + label + '</div>';
        }).join('') +
      '</div>' +
      '<button class="btn btn-next" style="margin:0 auto" onclick="reviewAnswers()">Review Answers</button>' +
      '<button class="btn btn-reset" style="margin:12px auto 0" onclick="resetQuiz()">&#8635; Try Again</button>' +
    '</div>';
  document.getElementById('dotsNav').innerHTML = '';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = score + ' / ' + questions.length + ' correct';
}

function reviewAnswers() { current = 0; render(); }
render();
</script>
</body>
</html>
